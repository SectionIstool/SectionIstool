name: 构建

# 触发工作流的事件
on: 
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  builder_matrix:
    strategy:
      fail-fast: false
      matrix:
        arch: [ x86, x64, arm64 ]
        os: [ ubuntu-20.04, windows-latest, macos-13, macos-14 ]
        exclude:
          - os: ubuntu-20.04
            arch: x86
          - os: ubuntu-20.04
            arch: arm64
          - os: macos-13
            arch: x86
          - os: macos-13
            arch: arm64
          - os: windows-latest
            arch: arm64
          - os: macos-14
            arch: x86
          - os: macos-14
            arch: x64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2
      - name: Setup Python
        uses: actions/setup-python@v5.3.0
        with:
          python-version: '3.8.10'
          architecture: ${{ matrix.arch }}
      - name: Setup uv
        uses: astral-sh/setup-uv@v4
      - name: Init zip folder
        run: mkdir zip

      - name: Run Windows build
        if: ${{ matrix.os == 'windows-latest' }}
        run: |
          # 下载 zip.exe 工具
          curl -o zip.exe -L http://www.stahlworks.com/dev/zip.exe
          # 创建虚拟环境
          uv venv
          # 激活虚拟环境
          .venv/Scripts/activate
          # 安装依赖
          uv pip install -r requirements.txt
          # 安装 pyinstaller
          uv pip install pyinstaller
          # 使用 pyinstaller 打包应用程序
          pyinstaller main.py `
            -w `
            -i ./resources/SectionIstool_icon.ico `
            -n Sectionlstool `
            --contents-directory . `
            --add-data ./app/resource/icon:icon `
            --add-data ./app/resource/README:README `
            --add-data ./app/Settings:Settings `
            --add-data LICENSE:.
          # 使用 zip.exe 工具将打包好的文件压缩成 ZIP 文件
          ./zip -r -q "zip/Sectionlstool-Windows-${{ matrix.arch }} (Unsigned).zip" dist/Sectionlstool/*

      - name: Run Linux build
        if: ${{ matrix.os == 'ubuntu-20.04' }}
        run: |
          # 创建虚拟环境
          uv venv
          # 激活虚拟环境
          source .venv/bin/activate
          # 安装依赖
          uv pip install -r requirements.txt
          # 安装 pyinstaller
          uv pip install pyinstaller
          # 使用 pyinstaller 打包应用程序
          pyinstaller main.py \
            -w \
            -i ./resources/SectionIstool_icon.ico \
            -n Sectionlstool \
            --contents-directory . \
            --add-data ./app/resource/icon:icon \
            --add-data ./app/resource/README:README \
            --add-data ./app/Settings:Settings \
            --add-data LICENSE:.
          # 使用系统自带的 zip 工具将打包好的文件压缩成 ZIP 文件
          zip -r -q zip/Sectionlstool-Ubuntu22.04.zip dist/Sectionlstool/*

      - name: Run macOS build
        if: ${{ startsWith(matrix.os, 'macos') }}
        run: |
          # 创建虚拟环境
          uv venv
          # 激活虚拟环境
          source .venv/bin/activate
          # 安装依赖
          uv pip install -r requirements.txt
          # 安装 pyinstaller
          uv pip install pyinstaller
          # 使用 pyinstaller 打包应用程序
          pyinstaller main.py \
            -w \
            -i ./resources/SectionIstool_icon.icns \
            -n "Sectionlstool" \
            --contents-directory . \
            --add-data ./app/resource/icon:icon \
            --add-data ./app/resource/README:README \
            --add-data ./app/Settings:Settings \
            --add-data LICENSE:.
          # 使用系统自带的 zip 工具将打包好的文件压缩成 ZIP 文件
          zip -r -q "zip/Sectionlstool-macOS-${{ matrix.arch }} (bundle).zip" dist/Sectionlstool.app/*
          zip -r -q zip/Sectionlstool-macOS-${{ matrix.arch }}.zip dist/Sectionlstool/*

      - name: Upload unsigned application
        if: ${{ ( matrix.os != 'windows-latest' && github.event_name != 'pull_request' ) || github.event_name == 'pull_request' }}
        uses: actions/upload-artifact@v4.4.2
        with:
          name: ${{ matrix.os }}-${{ matrix.arch }}
          path: ./zip

      - name: Upload unsigned single file
        if: ${{ matrix.os == 'windows-latest' && github.event_name != 'pull_request' }}
        uses: actions/upload-artifact@v4.4.2
        with:
          name: windows-${{ matrix.arch }} (Unsigned single)
          path: ./dist/Sectionlstool/Sectionlstool.exe

      - name: Recompress
        if: ${{ matrix.os == 'windows-latest' && github.event_name != 'pull_request' }}
        run: |
          del "zip/Sectionlstool-Windows-${{ matrix.arch }} (Unsigned).zip"
          ./zip -r -q zip/Sectionlstool-Windows-${{ matrix.arch }}.zip dist/Sectionlstool/*

      - name: Upload signed application
        if: ${{ matrix.os == 'windows-latest' && github.event_name != 'pull_request' }}
        uses: actions/upload-artifact@v4.4.2
        with:
          name: windows-latest-${{ matrix.arch }}
          path: ./zip

  debian:
    runs-on: ubuntu-latest
    container:
      image: debian:10
    steps:
      - name: Install dependencies
        shell: bash
        run: |
          apt-get update
          apt-get install -y wget zip binutils libglib2.0-dev libfreetype6 libxfixes3 libgssapi-krb5-2 libdbus-1-3 libxext6 libfontconfig1 libxrandr2 libnspr4 libx11-xcb1 libxrender1 libasound2 libxkbcommon0 libxtst6 libnss3 libxdamage1 libxcomposite1 libcups2 libwayland-client0 libwayland-cursor0 libcairo2 libcairo-gobject2 libpango-1.0-0 libgtk-3-0 libgdk-pixbuf2.0-0 libxkbcommon-x11-0 libwayland-egl1 libxcb-xinerama0 libxcb-render-util0 libxcb-randr0 libxcb-image0 libxcb-sync1 libxcb-keysyms1 libxcb-shape0 libxcb-xfixes0 libxcb-icccm4 libxcb-glx0 git
          wget http://ftp.debian.org/debian/pool/main/x/xcb-util/libxcb-util1_0.4.0-1+b1_amd64.deb
          dpkg -i libxcb-util1_0.4.0-1+b1_amd64.deb
      - name: Checkout repository
        uses: actions/checkout@v4.2.2
      - name: Setup uv & python
        uses: astral-sh/setup-uv@v4
        with:
          python-version: 3.8.10
      - name: Run Linux (Debian 10) build
        shell: bash
        run: |
          mkdir zip
          uv venv
          source .venv/bin/activate
          uv pip install -r requirements.txt
          uv pip install pyinstaller
          pyinstaller main.py \
            -w \
            -n Sectionlstool \
            --contents-directory . \
            --add-data ./app/resource/icon:icon \
            --add-data ./app/resource/README:README \
            --add-data ./app/Settings:Settings \
            --add-data LICENSE:.
          zip -r -q zip/SectionIstool-Debian10.zip dist/SectionIstool/*

      - name: Upload
        uses: actions/upload-artifact@v4.4.2
        with:
          name: debian10-x64
          path: ./zip

  release:
    needs: [debian, builder_matrix]
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    uses: ./.github/workflows/release.yml
    permissions:
      contents: write
    with:
      runid: ${{ github.run_id }}